name: Pre-PR Checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      dart: ${{ steps.filter.outputs.dart }}
      android_native: ${{ steps.filter.outputs.android_native }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: dorny/paths-filter@v4.0.2
        id: filter
        with:
          filters: |
            dart:
              - 'lib/**/*.dart'
              - 'test/**/*.dart'
              - 'pubspec.yaml'
            android_native:
              - 'android/**/*.kt'
              - 'android/**/*.java'
              - 'android/**/build.gradle*'
              - 'android/**/*.xml'
              - 'android/**/*.properties'
            workflows:
              - '.github/workflows/**'
              - 'tool/**'

  temp-files-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Run Temp Files Guard
        run: ./tool/pre_pr_check.sh

  flutter-checks:
    needs: changes
    if: ${{ needs.changes.outputs.dart == 'true' || needs.changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Format Check
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --no-fatal-infos lib test

      - name: Run Tests
        run: flutter test test/

  android-lint:
    needs: changes
    if: ${{ needs.changes.outputs.android_native == 'true' || needs.changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up Java
        uses: actions/setup-java@v5.5.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download ktlint
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.3.0/ktlint
          chmod a+x ktlint

      - name: Run ktlint
        run: ./ktlint "android/**/*.kt"

  android-build:
    needs: [changes, flutter-checks, android-lint]
    if: |
      always() &&
      (needs.changes.outputs.dart == 'true' || needs.changes.outputs.android_native == 'true' || needs.changes.outputs.workflows == 'true') &&
      (needs.flutter-checks.result == 'success' || needs.flutter-checks.result == 'skipped') &&
      (needs.android-lint.result == 'success' || needs.android-lint.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Validate Core Tag
        run: |
          TAG=$(cat tool/core_version.txt | xargs)
          echo "Using tag: $TAG"
          if [[ "$TAG" == *"-test"* ]]; then
            echo "ERROR: Refusing to build PR with a test core tag ($TAG)."
            exit 1
          fi
          echo "CORE_RELEASE_TAG=$TAG" >> $GITHUB_ENV

      - name: Set up Java 17
        uses: actions/setup-java@v5.5.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache AARs
        id: aar-cache
        uses: actions/cache@v6.1.0
        with:
          path: android/app/libs
          key: ${{ runner.os }}-aar-internal-${{ hashFiles('tool/core_version.txt') }}

      - name: Download Secure AARs
        if: steps.aar-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p android/app/libs

          echo "Downloading Core AARs from Internal Release..."
          curl -L -O "https://github.com/mobinsamadir/ivpn_app/releases/download/${{ env.CORE_RELEASE_TAG }}/libbox.aar"
          curl -L -O "https://github.com/mobinsamadir/ivpn_app/releases/download/${{ env.CORE_RELEASE_TAG }}/libbox-legacy.aar"
          curl -L -O "https://github.com/mobinsamadir/ivpn_app/releases/download/${{ env.CORE_RELEASE_TAG }}/aar_checksums.txt"

          mv libbox.aar android/app/libs/
          mv libbox-legacy.aar android/app/libs/ || true
          mv aar_checksums.txt tool/

          echo "Downloading Terminal View..."
          curl -L -A "Mozilla/5.0" -o android/app/libs/terminal-view.aar "https://jitpack.io/com/github/termux/termux-app/terminal-view/v0.118.3/terminal-view-v0.118.3.aar"
          echo "Downloading Terminal Emulator..."
          curl -L -A "Mozilla/5.0" -o android/app/libs/terminal-emulator.aar "https://jitpack.io/com/github/termux/termux-app/terminal-emulator/v0.118.3/terminal-emulator-v0.118.3.aar"

      - name: Verify AAR Checksums
        if: steps.aar-cache.outputs.cache-hit != 'true'
        run: |
          echo "Verifying SHA256 hashes against trusted anchor..."
          cd android/app/libs
          # Path logic check:
          # current dir: repo-root/android/app/libs
          # target file: repo-root/tool/aar_checksums.txt
          #   .. (libs -> app)
          #   .. (app -> android)
          #   .. (android -> root)
          # Thus: ../../../tool/aar_checksums.txt is correct.
          sha256sum --strict --check ../../../tool/aar_checksums.txt

      - name: Build Android App Bundle (Debug)
        run: flutter build appbundle --debug

  pr-summary:
    needs: [changes, temp-files-guard, flutter-checks, android-lint, android-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check Job Statuses
        run: |
          FAILED=false

          if [ "${{ needs.changes.result }}" == "failure" ] || [ "${{ needs.changes.result }}" == "cancelled" ]; then
            echo "changes job failed or was cancelled."
            FAILED=true
          fi

          if [ "${{ needs.temp-files-guard.result }}" == "failure" ] || [ "${{ needs.temp-files-guard.result }}" == "cancelled" ]; then
            echo "temp-files-guard job failed or was cancelled."
            FAILED=true
          fi

          if [ "${{ needs.flutter-checks.result }}" == "failure" ] || [ "${{ needs.flutter-checks.result }}" == "cancelled" ]; then
            echo "flutter-checks job failed or was cancelled."
            FAILED=true
          fi

          if [ "${{ needs.android-lint.result }}" == "failure" ] || [ "${{ needs.android-lint.result }}" == "cancelled" ]; then
            echo "android-lint job failed or was cancelled."
            FAILED=true
          fi

          if [ "${{ needs.android-build.result }}" == "failure" ] || [ "${{ needs.android-build.result }}" == "cancelled" ]; then
            echo "android-build job failed or was cancelled."
            FAILED=true
          fi

          if [ "$FAILED" == "true" ]; then
            echo "Pipeline failed."
            exit 1
          fi

          echo "All checks passed successfully."