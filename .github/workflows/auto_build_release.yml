name: Auto Build & Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.changes.outputs.android }}
      windows: ${{ steps.changes.outputs.windows }}
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            android:
              - 'lib/**'
              - 'android/**'
              - 'assets/**'
              - 'pubspec.yaml'
              - '.github/workflows/auto_build_release.yml'
              - 'tool/**'
            windows:
              - 'lib/**'
              - 'windows/**'
              - 'assets/**'
              - 'pubspec.yaml'
              - '.github/workflows/auto_build_release.yml'
              - 'tool/**'

  build-android:
    needs: filter
    if: needs.filter.outputs.android == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5.5.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Pub Dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Android Assets
        id: android-assets-cache
        uses: actions/cache@v6.1.0
        with:
          path: assets
          key: android-assets-v2-${{ hashFiles('tool/setup_core.dart') }}

      - name: Setup Core Assets (Download Binaries)
        run: |
          flutter pub get
          dart run tool/setup_core.dart

      - name: Update Version Code (Dynamic)
        run: dart run tool/update_version.dart

      - name: Validate Core Tag
        run: |
          TAG=$(cat tool/core_version.txt | xargs)
          echo "Using tag: $TAG"
          echo "CORE_RELEASE_TAG=$TAG" >> $GITHUB_ENV

      - name: Cache AARs
        id: aar-cache
        uses: actions/cache@v6.1.0
        with:
          path: android/app/libs
          key: ${{ runner.os }}-aar-internal-${{ hashFiles('tool/core_version.txt') }}

      - name: Download Secure AARs
        if: steps.aar-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p android/app/libs
          echo "Downloading Core AARs from Internal Release..."
          curl -L -O "https://github.com/mobinsamadir/ivpn_app/releases/download/${{ env.CORE_RELEASE_TAG }}/libbox.aar"
          curl -L -O "https://github.com/mobinsamadir/ivpn_app/releases/download/${{ env.CORE_RELEASE_TAG }}/libbox-legacy.aar"
          curl -L -O "https://github.com/mobinsamadir/ivpn_app/releases/download/${{ env.CORE_RELEASE_TAG }}/aar_checksums.txt"

          mv libbox.aar android/app/libs/
          mv libbox-legacy.aar android/app/libs/ || true
          mv aar_checksums.txt tool/

          echo "Downloading Terminal View..."
          curl -L -A "Mozilla/5.0" -o android/app/libs/terminal-view.aar "https://jitpack.io/com/github/termux/termux-app/terminal-view/v0.118.3/terminal-view-v0.118.3.aar"
          echo "Downloading Terminal Emulator..."
          curl -L -A "Mozilla/5.0" -o android/app/libs/terminal-emulator.aar "https://jitpack.io/com/github/termux/termux-app/terminal-emulator/v0.118.3/terminal-emulator-v0.118.3.aar"

      - name: Verify AAR Checksums
        if: steps.aar-cache.outputs.cache-hit != 'true'
        run: |
          echo "Verifying SHA256 hashes against trusted anchor..."
          cd android/app/libs
          sha256sum --strict --check ../../../tool/aar_checksums.txt

      - name: Build APK (Universal & Split Per ABI)
        run: |
          yes | flutter doctor --android-licenses || true
          flutter build apk --release
          flutter build apk --split-per-abi --release

      - name: Rename APKs to iVPN
        run: |
          cd build/app/outputs/flutter-apk/
          for f in app-*.apk; do
            if [ -f "$f" ]; then
              new_name=$(echo "$f" | sed 's/^app-/iVPN-/')
              mv "$f" "$new_name"
              echo "Renamed $f -> $new_name"
            fi
          done
          ls -la

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/iVPN-*.apk
          retention-days: 1

  build-windows:
    needs: filter
    if: needs.filter.outputs.windows == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Cache Pub Dependencies
        uses: actions/cache@v6.1.0
        with:
          path: C:\Users\runneradmin\AppData\Local\Pub\Cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Windows Assets
        id: assets-cache
        uses: actions/cache@v6.1.0
        with:
          path: assets
          key: windows-assets-v2-${{ hashFiles('tool/setup_core.dart') }}

      - name: Setup Core Assets (Download Binaries)
        run: |
          flutter pub get
          dart run tool/setup_core.dart

      - name: Update Version Code (Dynamic)
        run: dart run tool/update_version.dart

      - name: Build iVPN Windows
        run: |
          flutter pub get
          bash scripts/clean_windows_build.sh
          flutter build windows --release

      - name: Compress Windows Release
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ivpn-windows.zip -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: ivpn-windows.zip
          retention-days: 1

  publish-release:
    needs: [filter, build-android, build-windows]
    if: always() && (needs.build-android.result == 'success' || needs.build-windows.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Download Android Artifacts
        if: needs.build-android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: release-files

      - name: Download Windows Artifacts
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: release-files

      - name: Create Combined GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: iVPN v1.0.${{ github.run_number }}
          files: release-files/*
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
