name: Auto Build & Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Set to '1' to enable Windows build, or '0' to suspend Windows build & save runner minutes
  ENABLE_WINDOWS_BUILD: '0'

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.changes.outputs.android }}
      windows: ${{ steps.changes.outputs.windows }}
      version: ${{ steps.compute_version.outputs.version }}
      version_code: ${{ steps.compute_version.outputs.version_code }}
      enable_windows: ${{ steps.set_flags.outputs.enable_windows }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Job Flags
        id: set_flags
        run: echo "enable_windows=${ENABLE_WINDOWS_BUILD}" >> $GITHUB_OUTPUT

      - name: Compute Next Release Version
        id: compute_version
        run: |
          if [ -f assets/version.json ]; then
            BASE_VER=$(jq -r '.version // "2.0.0"' assets/version.json | xargs)
            BASE_CODE=$(jq -r '.version_code // 2000' assets/version.json | xargs)
          else
            BASE_VER="2.0.0"
            BASE_CODE="2000"
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VER"

          # Find all existing git tags matching vMAJOR.MINOR.*
          EXISTING_TAGS=$(git tag -l "v${MAJOR}.${MINOR}.*" | sed "s/^v${MAJOR}\.${MINOR}\.//" | grep -E '^[0-9]+$' | sort -n | tail -n 1)

          if [ -n "$EXISTING_TAGS" ] && [ "$EXISTING_TAGS" -ge "$PATCH" ]; then
            NEXT_PATCH=$((EXISTING_TAGS + 1))
          else
            NEXT_PATCH=$PATCH
          fi

          DIFF=$((NEXT_PATCH - PATCH))
          NEXT_VER="${MAJOR}.${MINOR}.${NEXT_PATCH}"
          NEXT_CODE=$((BASE_CODE + DIFF))

          echo "Computed Next Version: v${NEXT_VER}+${NEXT_CODE} (assets/version.json remains untouched at ${BASE_VER}+${BASE_CODE})"
          echo "version=${NEXT_VER}" >> $GITHUB_OUTPUT
          echo "version_code=${NEXT_CODE}" >> $GITHUB_OUTPUT

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            android:
              - 'lib/**'
              - 'android/**'
              - 'assets/**'
              - 'pubspec.yaml'
              - '.github/workflows/auto_build_release.yml'
              - 'tool/**'
            windows:
              - 'lib/**'
              - 'windows/**'
              - 'assets/**'
              - 'pubspec.yaml'
              - '.github/workflows/auto_build_release.yml'
              - 'tool/**'

  build-android:
    needs: filter
    if: needs.filter.outputs.android == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Android Assets
        id: android-assets-cache
        uses: actions/cache@v4
        with:
          path: assets
          key: android-assets-v2-${{ hashFiles('tool/setup_core.dart') }}

      - name: Setup Core Assets (Download Binaries)
        run: |
          flutter pub get
          dart run tool/setup_core.dart

      - name: Update Version Code (Dynamic)
        run: dart run tool/update_version.dart --version "${{ needs.filter.outputs.version }}" --code "${{ needs.filter.outputs.version_code }}"

      - name: Validate Core Tag
        run: |
          TAG=$(cat tool/core_version.txt | xargs)
          echo "Using tag: $TAG"
          echo "CORE_RELEASE_TAG=$TAG" >> $GITHUB_ENV

      - name: Cache AARs
        id: aar-cache
        uses: actions/cache@v4
        with:
          path: android/app/libs
          key: ${{ runner.os }}-aar-internal-${{ hashFiles('tool/core_version.txt') }}

      - name: Download Secure AARs
        if: steps.aar-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p android/app/libs
          echo "Downloading Core AARs from Internal Release..."
          curl -L -O "https://github.com/mobinsamadir/ivpn_app/releases/download/${{ env.CORE_RELEASE_TAG }}/libbox.aar"
          curl -L -O "https://github.com/mobinsamadir/ivpn_app/releases/download/${{ env.CORE_RELEASE_TAG }}/libbox-legacy.aar"
          curl -L -O "https://github.com/mobinsamadir/ivpn_app/releases/download/${{ env.CORE_RELEASE_TAG }}/aar_checksums.txt"

          mv libbox.aar android/app/libs/
          mv libbox-legacy.aar android/app/libs/ || true
          mv aar_checksums.txt tool/

      - name: Verify AAR Checksums
        if: steps.aar-cache.outputs.cache-hit != 'true'
        run: |
          echo "Verifying SHA256 hashes against trusted anchor..."
          cd android/app/libs
          sha256sum --strict --check ../../../tool/aar_checksums.txt

      - name: Build APK (Universal & Split Per ABI)
        run: |
          yes | flutter doctor --android-licenses || true
          flutter build apk --release
          flutter build apk --split-per-abi --release

      - name: Rename APKs to iVPN
        run: |
          cd build/app/outputs/flutter-apk/
          for f in app-*.apk; do
            if [ -f "$f" ]; then
              new_name=$(echo "$f" | sed 's/^app-/iVPN-/')
              mv "$f" "$new_name"
              echo "Renamed $f -> $new_name"
            fi
          done
          if [ ! -f "iVPN-release.apk" ]; then
            echo "::error::iVPN-release.apk is missing after build and rename!"
            exit 1
          fi
          echo "Verified required artifact iVPN-release.apk exists."
          ls -la

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/iVPN-*.apk
          retention-days: 1

  build-windows:
    needs: filter
    if: needs.filter.outputs.enable_windows == '1' && (needs.filter.outputs.windows == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\Pub\Cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Windows Assets
        id: assets-cache
        uses: actions/cache@v4
        with:
          path: assets
          key: windows-assets-v2-${{ hashFiles('tool/setup_core.dart') }}

      - name: Setup Core Assets (Download Binaries)
        run: |
          flutter pub get
          dart run tool/setup_core.dart

      - name: Update Version Code (Dynamic)
        run: dart run tool/update_version.dart --version "${{ needs.filter.outputs.version }}" --code "${{ needs.filter.outputs.version_code }}"

      - name: Build iVPN Windows
        run: |
          flutter pub get
          bash scripts/clean_windows_build.sh
          flutter build windows --release

      - name: Compress Windows Release
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ivpn-windows.zip -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: ivpn-windows.zip
          retention-days: 1

  publish-release:
    needs: [filter, build-android, build-windows]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && (needs.build-android.result == 'success' || needs.build-windows.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Extract Release Notes
        run: |
          if [ -f assets/version.json ]; then
            jq -r '.release_notes // ""' assets/version.json > release_notes.txt
          else
            echo "" > release_notes.txt
          fi
          echo "Release target: v${{ needs.filter.outputs.version }}"

      - name: Create Combined GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.filter.outputs.version }}
          name: iVPN v${{ needs.filter.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: release_notes.txt
          files: |
            release-assets/*.apk
            release-assets/*.zip
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
