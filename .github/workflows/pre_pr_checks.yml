name: Pre-PR Checks

on:
  # ==============================================================================
  # 🚦 TRIGGER OPTIONS (Optimize for GitHub Free Minutes)
  # ==============================================================================

  # 1. RUN ON EVERY PR (Uncomment below to enable)
  # pull_request:
  #   branches:
  #     - main
  #   paths-ignore:
  #     - '**.md'
  #     - 'docs/**'
  #     - 'LICENSE'
  #     - '.gitignore'

  # 2. RUN AT SPECIFIC HOURS (Scrum Master time - 18:30, 19:30, 20:30 UTC)
  schedule:
    - cron: '30 18,19,20 * * *'

  # 3. RUN MANUALLY (Always enabled)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            dart:
              - 'lib/**/*.dart'
              - 'test/**/*.dart'
              - 'pubspec.yaml'
            android_native:
              - 'android/**/*.kt'
              - 'android/**/*.java'
              - 'android/**/build.gradle*'
              - 'android/**/*.xml'
              - 'android/**/*.properties'
            workflows:
              - '.github/workflows/**'
              - 'tool/**'

      - name: Run Temp Files Guard
        run: ./tool/pre_pr_check.sh

      - name: Set up Java 17
        if: ${{ steps.filter.outputs.dart == 'true' || steps.filter.outputs.android_native == 'true' || steps.filter.outputs.workflows == 'true' }}
        uses: actions/setup-java@v5.5.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        if: ${{ steps.filter.outputs.dart == 'true' || steps.filter.outputs.android_native == 'true' || steps.filter.outputs.workflows == 'true' }}
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Flutter
        if: ${{ steps.filter.outputs.dart == 'true' || steps.filter.outputs.android_native == 'true' || steps.filter.outputs.workflows == 'true' }}
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        if: ${{ steps.filter.outputs.dart == 'true' || steps.filter.outputs.workflows == 'true' || steps.filter.outputs.android_native == 'true' }}
        run: flutter pub get

      - name: Format Check
        if: ${{ steps.filter.outputs.dart == 'true' || steps.filter.outputs.workflows == 'true' }}
        run: dart format --set-exit-if-changed .

      - name: Analyze
        if: ${{ steps.filter.outputs.dart == 'true' || steps.filter.outputs.workflows == 'true' }}
        run: flutter analyze --no-fatal-infos lib test

      - name: Run Tests
        if: ${{ steps.filter.outputs.dart == 'true' || steps.filter.outputs.workflows == 'true' }}
        run: flutter test test/

      - name: Download and Run ktlint
        if: ${{ steps.filter.outputs.android_native == 'true' || steps.filter.outputs.workflows == 'true' }}
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.3.0/ktlint
          chmod a+x ktlint
          ./ktlint "android/**/*.kt"

      - name: Validate Core Tag
        if: ${{ steps.filter.outputs.dart == 'true' || steps.filter.outputs.android_native == 'true' || steps.filter.outputs.workflows == 'true' }}
        run: |
          TAG=$(cat tool/core_version.txt | xargs)
          echo "Using tag: $TAG"
          if [[ "$TAG" == *"-test"* ]]; then
            echo "ERROR: Refusing to build PR with a test core tag ($TAG)."
            bash -c 'exit 1'
          fi
          echo "CORE_RELEASE_TAG=$TAG" >> $GITHUB_ENV

      - name: Cache AARs
        if: ${{ steps.filter.outputs.dart == 'true' || steps.filter.outputs.android_native == 'true' || steps.filter.outputs.workflows == 'true' }}
        id: aar-cache
        uses: actions/cache@v6.1.0
        with:
          path: android/app/libs
          key: ${{ runner.os }}-aar-internal-${{ hashFiles('tool/core_version.txt') }}

      - name: Download Secure AARs
        if: ${{ (steps.filter.outputs.dart == 'true' || steps.filter.outputs.android_native == 'true' || steps.filter.outputs.workflows == 'true') && steps.aar-cache.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p android/app/libs

          echo "Downloading Core AARs from Internal Release..."
          curl -L -O "https://github.com/mobinsamadir/ivpn_app/releases/download/${{ env.CORE_RELEASE_TAG }}/libbox.aar"
          curl -L -O "https://github.com/mobinsamadir/ivpn_app/releases/download/${{ env.CORE_RELEASE_TAG }}/libbox-legacy.aar"
          curl -L -O "https://github.com/mobinsamadir/ivpn_app/releases/download/${{ env.CORE_RELEASE_TAG }}/aar_checksums.txt"

          mv libbox.aar android/app/libs/
          mv libbox-legacy.aar android/app/libs/ || true
          mv aar_checksums.txt tool/

          echo "Downloading Terminal View..."
          curl -L -A "Mozilla/5.0" -o android/app/libs/terminal-view.aar "https://jitpack.io/com/github/termux/termux-app/terminal-view/v0.118.3/terminal-view-v0.118.3.aar"
          echo "Downloading Terminal Emulator..."
          curl -L -A "Mozilla/5.0" -o android/app/libs/terminal-emulator.aar "https://jitpack.io/com/github/termux/termux-app/terminal-emulator/v0.118.3/terminal-emulator-v0.118.3.aar"

      - name: Verify AAR Checksums
        if: ${{ (steps.filter.outputs.dart == 'true' || steps.filter.outputs.android_native == 'true' || steps.filter.outputs.workflows == 'true') && steps.aar-cache.outputs.cache-hit != 'true' }}
        run: |
          echo "Verifying SHA256 hashes against trusted anchor..."
          cd android/app/libs
          sha256sum --strict --check ../../../tool/aar_checksums.txt

      - name: Build Android App Bundle (Debug)
        if: ${{ steps.filter.outputs.dart == 'true' || steps.filter.outputs.android_native == 'true' || steps.filter.outputs.workflows == 'true' }}
        run: flutter build appbundle --debug
