name: iVPN Final Build

# Automatic triggers temporarily disabled during high-change period — run manually via workflow_dispatch until re-enabled
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

  # ==============================================================================
  # 🚦 TRIGGER OPTIONS (Optimize for GitHub Free Minutes)
  # ==============================================================================

  # 1. RUN ON PUSH (Uncomment below to enable)
  # pull_request:
  #   branches:
  #     - main
  #     - master
  #     - develop
  # paths-ignore:
  # - '**.md'
  # - 'docs/**'
  # - 'LICENSE'
  # - '.gitignore'


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  changes:
    if: github.event_name == 'pull_request' && github.actor == 'mastermind'
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      windows: ${{ steps.filter.outputs.windows }}
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            android:
              - 'lib/**'
              - 'android/**'
              - 'pubspec.yaml'
              - '.github/workflows/**'
              - 'tool/**'
            windows:
              - 'lib/**'
              - 'windows/**'
              - 'pubspec.yaml'
              - '.github/workflows/**'
              - 'tool/**'

  build-windows:
    needs: changes
    if: github.event_name == 'pull_request' && github.actor == 'mastermind' && needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Cache Pub Dependencies
        uses: actions/cache@v6.1.0
        with:
          path: C:\Users\runneradmin\AppData\Local\Pub\Cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Windows Assets
        id: assets-cache
        uses: actions/cache@v6.1.0
        with:
          path: assets
          key: windows-assets-v2-${{ hashFiles('tool/setup_core.dart') }}

      - name: Setup Core Assets (Download Binaries)
        run: |
          flutter pub get
          dart run tool/setup_core.dart

      - name: Update Version Code (Dynamic)
        run: dart run tool/update_version.dart

      - name: Build iVPN Windows
        run: |
          flutter pub get
          bash scripts/clean_windows_build.sh
          flutter build windows --release

      - name: Compress Windows Release
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ivpn-windows.zip -Force

      - name: Create Release and Upload Windows
        uses: softprops/action-gh-release@v3.0.1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          files: ivpn-windows.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    needs: changes
    if: github.event_name == 'pull_request' && github.actor == 'mastermind' && needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      
      - name: Set up JDK 17
        uses: actions/setup-java@v5.5.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Cache Pub Dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Clean Build
        run: flutter clean

      - name: Cache Android Assets
        id: android-assets-cache
        uses: actions/cache@v6.1.0
        with:
          path: assets
          key: android-assets-v2-${{ hashFiles('tool/setup_core.dart') }}

      - name: Setup Core Assets (Download Binaries)
        run: |
          flutter pub get
          dart run tool/setup_core.dart

      - name: Update Version Code (Dynamic)
        run: dart run tool/update_version.dart

      - name: Validate Core Tag
        run: |
          TAG=$(cat tool/core_version.txt | xargs)
          echo "Using tag: $TAG"
          if [[ "$TAG" == *"-test"* ]]; then
            echo "ERROR: Refusing to build PR with a test core tag ($TAG)."
            bash -c 'exit 1'
          fi
          echo "CORE_RELEASE_TAG=$TAG" >> $GITHUB_ENV

      - name: Cache AARs
        id: aar-cache
        uses: actions/cache@v6.1.0
        with:
          path: android/app/libs
          key: ${{ runner.os }}-aar-internal-${{ hashFiles('tool/core_version.txt') }}

      - name: Download Secure AARs
        if: steps.aar-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p android/app/libs

          echo "Downloading Core AARs from Internal Release..."
          curl -L -O "https://github.com/mobinsamadir/ivpn_app/releases/download/${{ env.CORE_RELEASE_TAG }}/libbox.aar"
          curl -L -O "https://github.com/mobinsamadir/ivpn_app/releases/download/${{ env.CORE_RELEASE_TAG }}/libbox-legacy.aar"
          curl -L -O "https://github.com/mobinsamadir/ivpn_app/releases/download/${{ env.CORE_RELEASE_TAG }}/aar_checksums.txt"

          mv libbox.aar android/app/libs/
          mv libbox-legacy.aar android/app/libs/ || true
          mv aar_checksums.txt tool/

          echo "Downloading Terminal View..."
          curl -L -A "Mozilla/5.0" -o android/app/libs/terminal-view.aar "https://jitpack.io/com/github/termux/termux-app/terminal-view/v0.118.3/terminal-view-v0.118.3.aar"
          echo "Downloading Terminal Emulator..."
          curl -L -A "Mozilla/5.0" -o android/app/libs/terminal-emulator.aar "https://jitpack.io/com/github/termux/termux-app/terminal-emulator/v0.118.3/terminal-emulator-v0.118.3.aar"

      - name: Verify AAR Checksums
        if: steps.aar-cache.outputs.cache-hit != 'true'
        run: |
          echo "Verifying SHA256 hashes against trusted anchor..."
          cd android/app/libs
          sha256sum --strict --check ../../../tool/aar_checksums.txt

      - name: Build APK
        run: |
          flutter pub get
          yes | flutter doctor --android-licenses || true
          flutter build apk --split-per-abi --release

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v3.0.1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
