name: Test Suite

on:
  schedule:
    - cron: "0 5 * * *"

  # ==============================================================================
  # 🚦 TRIGGER OPTIONS
  # ==============================================================================

  # 1. RUN ON EVERY PR (Uncomment below to enable)
  # pull_request:
  # branches:
  # - main


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name == 'pull_request' && github.actor == 'mastermind'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true # Verified: Enabled per Architect Directive

      - name: Cache Pub Dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
          # CI Optimization: Explicit Pub Cache

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test --coverage test/
