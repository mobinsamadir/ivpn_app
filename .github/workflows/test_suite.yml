name: Test Suite

on:
  # ==============================================================================
  # 🚦 TRIGGER OPTIONS
  # ==============================================================================

  # 1. RUN ON EVERY PR (Uncomment below to enable)
  pull_request:
    branches:
      - main

  # 2. RUN AT SPECIFIC HOURS (Scrum Master time - 18:30, 19:30, 20:30 UTC)
  schedule:
    - cron: '0 5 * * *'

  # 3. RUN MANUALLY (Always enabled)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.actor == 'mastermind'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true # Verified: Enabled per Architect Directive

      - name: Cache Pub Dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
          # CI Optimization: Explicit Pub Cache

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test --coverage test/
